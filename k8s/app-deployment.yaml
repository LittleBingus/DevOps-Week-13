apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk
  namespace: week13
spec:
  # TODO 1 (done): run 2 replicas.
  replicas: 2
  selector:
    matchLabels:
      app: helpdesk
  template:
    metadata:
      labels:
        app: helpdesk
    spec:
      containers:
        - name: helpdesk
          image: week13-helpdesk:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: helpdesk-config
            - secretRef:
                name: helpdesk-secret
          # TODO 2 (done): liveness = "is the Flask process alive?"
          # A failure RESTARTS the container. /healthz does not touch the database.
          # The initial delay gives init_db() time to wait for PostgreSQL before Flask starts listening.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # TODO 3 (done): readiness = "can this pod serve traffic right now?"
          # /ready checks PostgreSQL. A failure only REMOVES the pod from the Service endpoints.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 3
          # TODO 4 (done): requests = what the scheduler reserves; limits = the hard ceiling.
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
